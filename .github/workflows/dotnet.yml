# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

# Run workflow manually.
on:
  workflow_dispatch:

# Create release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Get version
      id: version
      shell: pwsh
      run: |
        $output = dotnet msbuild DiscordSecurityBot.csproj `
          -target:PrintVersion `
          -verbosity:normal `
          -nologo

        if ($LASTEXITCODE -ne 0) {
          throw "MSBuild failed to determine version"
        }

        $match = $output |
          Select-String 'PROJECT_VERSION=(\S+)' |
          Select-Object -Last 1

        if (-not $match) {
          throw "PROJECT_VERSION not found. MSBuild output:`n$output"
        }

        $version = $match.Matches[0].Groups[1].Value
        Write-Host "Detected version: [$version]"
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore -r win-x64

    - name: Publish for Windows
      run: >
        dotnet publish DiscordSecurityBot.csproj
        --configuration Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:DebugType=None -p:DebugSymbols=false
        --output ./publish/win-x64

    - name: Create ZIP archive
      run: >
        Compress-Archive -Path ./publish/win-x64/*
        -DestinationPath ./DiscordSecurityBot-${{ steps.version.outputs.version }}-win-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ steps.version.outputs.version }}
        tag_name: ${{ steps.version.outputs.version }}
        files: DiscordSecurityBot-${{ steps.version.outputs.version }}-win-x64.zip
        generate_release_notes: true
